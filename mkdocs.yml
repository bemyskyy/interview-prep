site_name: Interview Prep
site_description: База знаний для подготовки к техническим собеседованиям по Java и backend
site_author: bemyskyy
# Адрес опубликованного сайта: канонические ссылки, sitemap.xml, 404
site_url: https://bemyskyy.github.io/interview-prep/

# Ссылка на репозиторий в шапке и кнопка «Редактировать» на страницах
repo_url: https://github.com/bemyskyy/interview-prep
repo_name: bemyskyy/interview-prep
edit_uri: edit/main/docs/

theme:
  name: material
  language: ru
  # Переопределения шаблонов: mermaid из репозитория (overrides/main.html)
  custom_dir: overrides

  # Шрифты подключены локально в stylesheets/extra.css, без Google Fonts
  font: false

  # Цвета заданы в stylesheets/extra.css; схема по умолчанию — как в системе
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Светлая тема

  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github
    tag:
      default: material/tag-outline
      junior: material/signal-cellular-1
      middle: material/signal-cellular-2
      senior: material/signal-cellular-3

  features:
    # Навигация верхнего уровня — вкладки (Java, Spring, БД...)
    - navigation.tabs           # разделы верхнего уровня как вкладки сверху
    - navigation.tabs.sticky    # вкладки закреплены при прокрутке
    - navigation.sections       # подразделы группами в боковом меню
    - navigation.top            # кнопка "Наверх"
    - navigation.footer         # ссылки «Назад / Вперёд» внизу страницы
    - navigation.indexes        # раздел имеет свою обзорную страницу
    - toc.follow                # оглавление следует за прокруткой

    # Поиск
    - search.suggest            # автодополнение
    - search.highlight          # подсветка найденного
    - search.share              # поделиться поисковым запросом

    # Код
    - content.code.copy         # кнопка "Копировать"
    - content.code.annotate     # аннотации к коду

    # Вкладки «Коротко / Подробно» переключаются синхронно на всех страницах
    - content.tabs.link

    # Контент
    - content.tooltips          # подсказки глоссария (abbr) в стиле темы
    - content.action.edit       # кнопка «Редактировать на GitHub»

markdown_extensions:
  - abbr                        # термины глоссария с подсказкой при наведении
  - admonition
  - toc:
      permalink: true
      title: Содержание
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      # Пути в --8<-- считаются от корня репозитория: docs/java/jvm.md:cheatsheet
      base_path:
        - !relative $config_dir
      check_paths: true         # несуществующий файл или секция — ошибка сборки
      auto_append:
        - includes/abbreviations.md
  - tables
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: ru
  - tags:
      # Словарь тегов закрыт: опечатка в теге роняет сборку
      tags_allowed:
        # Уровень
        - Junior
        - Middle
        - Senior
        # Тема
        - Java
        - Spring
        - Базы данных
        - Kafka
        - Алгоритмы
        - Сети
        - System Design
        - Архитектура
        - DevOps
        # Сквозные темы
        - Многопоточность
        - Транзакции
        - Кэширование
        - Микросервисы
        - Безопасность
        - Тестирование
        - Подготовка
  # Старые адреса страниц, которых больше нет, ведут на их новое место:
  # опубликованные ссылки не отдают 404. Якорь из адреса сохраняется
  - redirects:
      redirect_maps:
        java/multithreading.md: concurrency/threads.md
        java/solid.md: design/solid.md
        java/patterns.md: design/creational-patterns.md
        spring/spring-ecosystem.md: spring/spring-security.md
        spring/spring-tools.md: spring/spring-testing.md
        system-design/system-design.md: system-design/interview.md
        architecture/architecture.md: architecture/ddd.md

# Проверяет, что страницы раздела «Подготовка» и числа страниц на главной
# не устарели (см. README)
hooks:
  - scripts/prep_pages.py

extra_css:
  - stylesheets/extra.css

# Иконки тегов уровня (theme.icon.tag)
extra:
  tags:
    Junior: junior
    Middle: middle
    Senior: senior

# includes/ лежит вне docs/ — следим за ним в mkdocs serve
watch:
  - includes

validation:
  anchors: warn

nav:
  - Старт: index.md

  - Подготовка:
      - За час до собеса: prep/last-hour.md
      - Вопросы собеса: prep/questions.md
      - Теги: prep/tags.md

  - Язык Java:
      - Платформа и память:
          - JVM и память: java/jvm.md
      - Язык и API:
          - Основы языка: java/basics.md
          - Строки: java/strings.md
          - Современная Java: java/modern-java.md
          - ООП: java/oop.md
          - Коллекции: java/collections.md
          - HashMap: java/hashmap.md
          - Исключения: java/exceptions.md
          - Дженерики: java/generics.md
          - Stream API: java/streams.md
          - Лямбды и Optional: java/functional.md
          - IO / NIO: java/io-nio.md

  - Многопоточность:
      - Потоки и ThreadLocal: concurrency/threads.md
      - Блокировки и синхронизаторы: concurrency/locks.md
      - JMM, volatile и атомики: concurrency/jmm.md
      - Deadlock, livelock, starvation: concurrency/deadlock.md
      - Пулы потоков и CompletableFuture: concurrency/executors.md
      - Потокобезопасные коллекции: concurrency/concurrent-collections.md
      - Виртуальные потоки: concurrency/virtual-threads.md

  - Дизайн кода:
      - SOLID: design/solid.md
      - Порождающие паттерны: design/creational-patterns.md
      - Структурные паттерны: design/structural-patterns.md
      - Поведенческие паттерны: design/behavioral-patterns.md

  - Spring:
      - Ядро:
          - Core (IoC, DI, AOP): spring/spring-core.md
          - Spring Boot: spring/spring-boot.md
      - Веб:
          - Spring MVC и WebFlux: spring/spring-mvc.md
          - Spring Security: spring/spring-security.md
      - Работа с БД:
          - Транзакции в Spring: spring/spring-transactions.md
          - Spring Data JPA и Hibernate: spring/spring-data-jpa.md
          - Кэширование: spring/spring-caching.md
      - Тесты и эксплуатация:
          - Тестирование: spring/spring-testing.md
          - Actuator и Micrometer: spring/spring-actuator.md

  - Данные:
      - SQL и индексы: database/sql.md
      - Транзакции и MVCC: database/transactions.md
      - Блокировки и конкурентные обновления: database/locking.md
      - NoSQL: database/nosql.md

  - Kafka:
      - Физика брокера: kafka/kafka.md
      - Consumer и Producer: kafka/kafka-consumer-producer.md
      - Гарантии доставки: kafka/kafka-reliability.md
      - Kafka в Spring: kafka/spring-kafka.md

  - System Design:
      - Интервью и оценка нагрузки: system-design/interview.md
      - Строительные блоки: system-design/building-blocks.md
      - Распределённые данные: system-design/distributed-data.md

  - Архитектура:
      - DDD, CQRS и Event Sourcing: architecture/ddd.md
      - Слоистая и гексагональная архитектура: architecture/hexagonal.md
      - Микросервисы и отказоустойчивость: architecture/microservices.md
      - Распределённые транзакции: architecture/distributed-transactions.md

  - Инфраструктура:
      - Docker, CI/CD, K8s: infrastructure/infrastructure.md
      - Kubernetes: infrastructure/kubernetes.md
      - Observability: infrastructure/observability.md

  - Computer Science:
      - Алгоритмы:
          - Теория (Big O, структуры, сортировки): algorithms/algorithms.md
          - Паттерны задач (LeetCode): algorithms/leetcode-patterns.md
      - Сети:
          - HTTP, TCP, REST, gRPC: networks/networks.md
